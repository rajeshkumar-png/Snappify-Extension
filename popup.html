<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="header">
    <h1>Recorder</h1>
    <p>Capture your steps instantly</p>
  </div>

  <div class="controls">
    <button id="openPanel">Open Recorder Panel</button>
    <button id="start" class="btn start">Start Recording</button>
    <button id="stop" class="btn stop">Stop Recording</button>
    <button id="export" class="btn export">Export Steps</button>
  </div>

  <div class="footer">
    <p>Built by You</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
