<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>

<div id="myRecorderSidebar" class="open">
  <div class="header">
    <h2>Recorder</h2>
    <span id="closeSidebar">×</span>
  </div>

  <div class="status">
    <p id="recordStatus">Not Recording</p>

    <button id="stopRec">Stop</button>
    <button id="exportRec">Export</button>
  </div>
</div>

<script src="sidebar.js"></script>
</body>
</html>
